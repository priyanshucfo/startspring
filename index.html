<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Image Grid</title>
    <style>
        /* Base Reset */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: Arial, sans-serif;
            position: relative;
        }

        /* Background Image */
        .full-screen-img {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        /* Transparent Top-Right 25% Invisible Click Zone */
        #top-right-trigger {
            position: absolute;
            top: 0;
            right: 0;
            width: 50vw;
            height: 50vh;
            background: transparent;
            z-index: 10;
        }

        /* Stealth Floating Number Menu Container */
        #number-menu {
            position: absolute;
            display: none; /* Hidden by default */
            z-index: 20;
            background: transparent; /* Completely invisible container */
            padding: 0;
            margin: 0;
            gap: 3px;
        }

        /* Ultra-hidden Grey Numbers */
        .num-btn {
            background: none;
            border: none;
            color: #3d3d3d; /* Dark muted grey to blend deeply into dark themes */
            font-size: 8px;   /* Extremely tiny text size */
            font-weight: normal;
            cursor: pointer;
            padding: 0 1px;
            opacity: 0.4;    /* Semi-transparent to camouflage into the image */
            transition: opacity 0.1s;
        }

        .num-btn:hover {
            opacity: 1; /* Revealed slightly only when hovered directly */
        }
    </style>
</head>
<body>

    <!-- 1. Background Image -->
    <img src="img.png" class="full-screen-img" alt="Screen Layout">

    <!-- 2. Invisible active grid sector (Top Right 25%) -->
    <div id="top-right-trigger"></div>

    <!-- 3. Camouflaged Context Menu -->
    <div id="number-menu">
        <button class="num-btn" data-key="1">1</button>
        <button class="num-btn" data-key="2">2</button>
        <button class="num-btn" data-key="3">3</button>
        <button class="num-btn" data-key="4">4</button>
        <button class="num-btn" data-key="5">5</button>
        <button class="num-btn" data-key="6">6</button>
        <button class="num-btn" data-key="7">7</button>
        <button class="num-btn" data-key="8">8</button>
    </div>

    <script>
        // Key-value store mapping the numbers to your specific URLs
        const gitUrls = {
            "1": "https://github.com",
            "2": "https://github.com",
            "3": "https://github.com",
            "4": "https://github.com",
            "5": "https://github.com",
            "6": "https://github.com",
            "7": "https://github.com",
            "8": "https://github.com"
        };

        const triggerZone = document.getElementById('top-right-trigger');
        const numberMenu = document.getElementById('number-menu');

        // Show menu at the exact click position inside the top-right 25% zone
        triggerZone.addEventListener('click', (event) => {
            event.stopPropagation(); 
            
            numberMenu.style.left = `${event.clientX}px`;
            numberMenu.style.top = `${event.clientY}px`;
            numberMenu.style.display = 'flex';
        });

        // Handle copying the git clone string when a number is clicked
        numberMenu.addEventListener('click', (event) => {
            if (event.target.classList.contains('num-btn')) {
                const key = event.target.getAttribute('data-key');
                const targetUrl = gitUrls[key];
                
                if (targetUrl) {
                    const cloneCommand = `git clone ${targetUrl}`;
                    navigator.clipboard.writeText(cloneCommand).then(() => {
                        console.log(`Copied: ${cloneCommand}`);
                    }).catch(err => {
                        console.error('Clipboard copy error: ', err);
                    });
                }
            }
        });

        // Hide menu ONLY if clicking anywhere outside the active top-right 25% zone
        document.addEventListener('click', (event) => {
            if (!triggerZone.contains(event.target)) {
                numberMenu.style.display = 'none';
            }
        });
    </script>
</body>
</html>
